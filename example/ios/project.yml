name: HybridNavigationDemo
options:
  bundleIdPrefix: com.yeyongping
  deploymentTarget:
    iOS: "17.0"
  developmentTeam: E394H7ER8M

settings:
  base:
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    CLANG_CXX_LIBRARY: libc++
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SDKROOT: iphoneos
    SWIFT_ENABLE_EXPLICIT_MODULES: NO
    USE_HERMES: true
    REACT_NATIVE_PATH: ${PODS_ROOT}/../../../node_modules/react-native
    OTHER_CFLAGS: $(inherited) -DRCT_REMOVE_LEGACY_ARCH=1
    OTHER_CPLUSPLUSFLAGS: $(OTHER_CFLAGS) -DFOLLY_NO_CONFIG -DFOLLY_MOBILE=1 -DFOLLY_USE_LIBCPP=1 -DFOLLY_CFG_NO_COROUTINES=1 -DFOLLY_HAVE_CLOCK_GETTIME=1 -DRCT_REMOVE_LEGACY_ARCH=1

targets:
  HybridNavigationDemo:
    type: application
    platform: iOS
    sources:
      - path: HybridNavigationDemo
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: E394H7ER8M
        ENABLE_BITCODE: NO
        INFOPLIST_FILE: HybridNavigationDemo/Info.plist
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks
        MARKETING_VERSION: "1.0"
        OTHER_LDFLAGS: $(inherited) -ObjC -lc++
        PRODUCT_BUNDLE_IDENTIFIER: com.yeyongping.HybridNavigationDemo
        PRODUCT_NAME: HybridNavigationDemo
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: 1,2
        VERSIONING_SYSTEM: apple-generic
    scheme:
      buildTargets:
        HybridNavigationDemo: all
      run:
        config: Debug
      test:
        config: Debug
      profile:
        config: Release
      analyze:
        config: Debug
      archive:
        config: Release
    preBuildScripts:
      - name: Bundle React Native code and images
        script: |
          set -e

          WITH_ENVIRONMENT="$REACT_NATIVE_PATH/scripts/xcode/with-environment.sh"
          REACT_NATIVE_XCODE="$REACT_NATIVE_PATH/scripts/react-native-xcode.sh"

          /bin/sh -c "\"$WITH_ENVIRONMENT\" \"$REACT_NATIVE_XCODE\""
        inputFiles:
          - $(SRCROOT)/.xcode.env.local
          - $(SRCROOT)/.xcode.env
